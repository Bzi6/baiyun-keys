name: Build unsigned IPA
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos‑14
    timeout‑minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter‑action@v2
        with:
          flutter‑version: '3.47.2'

      - name: 清理+获取依赖
        run: |
          flutter clean
          flutter pub get

      - name: Pod安装
        working‑directory: ios
        run: pod install --repo‑update

      - name: 编译iOS Release（不签名）
        run: flutter build ios --release --no‑codesign

      - name: 打包IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload
          zip -r baiyun_keys.ipa Payload

      - name: 下载产物
        uses: actions/upload‑artifact@v4
        with:
          name: baiyun‑keys‑unsigned‑ipa
          path: build/ios/iphoneos/baiyun_keys.ipa
