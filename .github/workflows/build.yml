name: Build-iOS
on:
  push:
    branches: [ main ]

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: flutter clean & pub get
        run: |
          flutter clean
          flutter pub get

      - name: Regenerate iOS project
        run: |
          # 备份关键文件（防止 flutter create 覆盖）
          cp ios/Runner/Info.plist /tmp/Info.plist.bak
          cp lib/main.dart /tmp/main.dart.bak
          # 删除不完整的 ios 目录并重新生成
          rm -rf ios
          flutter create . --platforms ios --project-name baiyun_keys
          # 恢复原有文件
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/Info.plist.bak ios/Runner/Info.plist

      - name: Set iOS deployment target to 13.0
        run: |
          cd ios
          if [ -f Podfile ]; then
            sed -i '' "s/platform :ios.*/platform :ios, '13.0'/" Podfile
          fi

      - name: pod install
        working-directory: ios
        run: |
          pod repo update
          pod install

      - name: Build unsigned ipa
        run: flutter build ios --release --no-codesign

      - name: Package ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload
          zip -r baiyun.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baiyun-ipa
          path: build/ios/iphoneos/baiyun.ipa
