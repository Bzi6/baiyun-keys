name: Build-iOS
on:
  push:
    branches: [ main ]

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: flutter doctor
        run: flutter doctor -v

      - name: flutter clean & pub get
        run: |
          flutter clean
          flutter pub get

      - name: ensure ios folder
        run: flutter create . --platforms ios

      - name: pod install
        working-directory: ios
        run: |
          pod repo update
          pod install

      - name: build unsigned ios
        run: flutter build ios --release --no-codesign

      - name: make ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload
          zip -r baiyun.ipa Payload

      - name: upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: baiyun-ipa
          path: build/ios/iphoneos/baiyun.ipa
