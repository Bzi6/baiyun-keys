name: Build-iOS
on:
  push:
    branches: [ main ]

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Fix Chinese package name
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          perl -i -pe 's/^name:\s*.+/name: baiyun_keys/' pubspec.yaml
          echo "=== pubspec.yaml first 5 lines ==="
          head -5 pubspec.yaml

      - name: flutter clean & pub get
        run: |
          flutter clean
          flutter pub get

      - name: Generate iOS project
        run: flutter create . --platforms ios --project-name baiyun_keys

      - name: pod install
        working-directory: ios
        run: |
          pod repo update
          pod install

      - name: Build unsigned ipa
        run: flutter build ios --release --no-codesign

      - name: Package ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload
          zip -r baiyun.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baiyun-ipa
          path: build/ios/iphoneos/baiyun.ipa
