name: Build-iOS
on:
  push:
    branches: [ main ]

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: flutter clean & pub get
        run: |
          flutter clean
          flutter pub get

      - name: Regenerate complete iOS project
        run: |
          # 备份原有 Info.plist（含蓝牙权限配置）
          cp ios/Runner/Info.plist /tmp/Info.plist.bak
          # 删除不完整的 ios 目录
          rm -rf ios
          # 重新生成完整 iOS 工程
          flutter create . --platforms ios --project-name baiyun_keys
          # 恢复 Info.plist，保留蓝牙权限
          cp /tmp/Info.plist.bak ios/Runner/Info.plist
          echo "=== iOS files ==="
          ls -la ios/
          ls -la ios/Runner/

      - name: Set iOS deployment target to 13.0
        run: |
          cd ios
          if [ -f Podfile ]; then
            sed -i '' "s/platform :ios.*/platform :ios, '13.0'/" Podfile
            echo "=== Podfile head ==="
            head -5 Podfile
          fi

      - name: pod install
        working-directory: ios
        run: |
          pod repo update
          pod install

      - name: Build unsigned ipa
        run: flutter build ios --release --no-codesign

      - name: Package ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload
          zip -r baiyun.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baiyun-ipa
          path: build/ios/iphoneos/baiyun.ipa
